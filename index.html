<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>線？点？しわけくん</title>
    <style>
        :root {
            --bg-color: #f0f8ff;
            --primary: #4CAF50;
            --btn-line: #ff7675;
            --btn-point: #74b9ff;
            --btn-both: #a29bfe;
            --btn-none: #b2bec3;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        header {
            text-align: center;
            background: var(--primary);
            color: white;
            padding: 10px;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 10;
        }

        /* レーン（回転寿司部分） */
        #lane-container {
            flex: 1;
            position: relative;
            background: #e0e0e0;
            border-bottom: 8px solid #9e9e9e;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #target-zone {
            width: 150px;
            height: 150px;
            border: 4px dashed #ff9800;
            border-radius: 10px;
            background: rgba(255, 152, 0, 0.1);
            position: absolute;
            z-index: 1;
        }

        .shape-item {
            position: absolute;
            width: 120px;
            height: 120px;
            z-index: 2;
            transition: left 0.5s linear;
        }

        /* 操作ボタンエリア */
        #controls {
            height: 200px;
            background: white;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 15px;
            padding: 20px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
        }

        .sort-btn {
            font-size: 22px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .sort-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 rgba(0,0,0,0.2);
        }

        #btn-line { background-color: var(--btn-line); }
        #btn-point { background-color: var(--btn-point); }
        #btn-both { background-color: var(--btn-both); }
        #btn-none { background-color: var(--btn-none); }

        /* 検証モーダル（解説画面） */
        #modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            color: white;
        }

        #modal-result {
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        #lab-area {
            width: 200px;
            height: 200px;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 30px;
        }

        #lab-shape {
            width: 160px;
            height: 160px;
        }

        /* アニメーション用クラス */
        .anim-point {
            animation: rotate180 2s ease-in-out infinite alternate;
        }
        @keyframes rotate180 {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(180deg); }
        }

        .axis-line {
            position: absolute;
            width: 4px;
            height: 100%;
            background: red;
            display: none;
        }

        #next-btn {
            padding: 15px 40px;
            font-size: 24px;
            border-radius: 30px;
            border: none;
            background: #ffeb3b;
            color: #333;
            font-weight: bold;
            cursor: pointer;
        }

        #start-overlay {
            position: absolute;
            top:0; left:0; width:100%; height:100%;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

    </style>
</head>
<body>

    <div id="start-overlay">
        <button id="next-btn" onclick="startGame()">ゲームスタート！</button>
    </div>

    <header>線？点？しわけくん</header>

    <div id="lane-container">
        <div id="target-zone"></div>
        </div>

    <div id="controls">
        <button class="sort-btn" id="btn-line" onclick="checkAnswer('line')">線対称のみ</button>
        <button class="sort-btn" id="btn-point" onclick="checkAnswer('point')">点対称のみ</button>
        <button class="sort-btn" id="btn-both" onclick="checkAnswer('both')">どっちも！</button>
        <button class="sort-btn" id="btn-none" onclick="checkAnswer('none')">どちらでもない</button>
    </div>

    <div id="modal">
        <div id="modal-result">正解！</div>
        <div id="lab-area">
            <div id="lab-shape"></div>
            <div id="axis" class="axis-line"></div>
        </div>
        <p id="modal-exp" style="font-size: 18px; margin-bottom: 20px;"></p>
        <button id="next-btn" onclick="nextShape()">次へすすむ</button>
    </div>

    <script>
        // 30種類の図形データ (SVG)
        const shapesData = [
            { id: 1, name: "二等辺三角形", type: "line", svg: '<polygon points="50,10 90,90 10,90" fill="#ff6b6b"/>' },
            { id: 2, name: "平行四辺形", type: "point", svg: '<polygon points="30,20 90,20 70,80 10,80" fill="#4ecdc4"/>' },
            { id: 3, name: "正方形", type: "both", svg: '<rect x="20" y="20" width="60" height="60" fill="#45b7d1"/>' },
            { id: 4, name: "長方形", type: "both", svg: '<rect x="10" y="30" width="80" height="40" fill="#96ceb4"/>' },
            { id: 5, name: "ひし形", type: "both", svg: '<polygon points="50,10 90,50 50,90 10,50" fill="#ffeead"/>' },
            { id: 6, name: "等脚台形", type: "line", svg: '<polygon points="30,20 70,20 90,80 10,80" fill="#d4a5a5"/>' },
            { id: 7, name: "円", type: "both", svg: '<circle cx="50" cy="50" r="40" fill="#9b59b6"/>' },
            { id: 8, name: "半円", type: "line", svg: '<path d="M 10,50 A 40,40 0 0,1 90,50 Z" fill="#3498db"/>' },
            { id: 9, name: "アルファベット N", type: "point", svg: '<path d="M 25,80 L 25,20 L 75,80 L 75,20" stroke="#e67e22" stroke-width="15" fill="none"/>' },
            { id: 10, name: "アルファベット S", type: "point", svg: '<path d="M 80,30 Q 80,10 50,10 Q 20,10 20,30 Q 20,50 50,50 Q 80,50 80,70 Q 80,90 50,90 Q 20,90 20,70" stroke="#2ecc71" stroke-width="12" fill="none"/>' },
            { id: 11, name: "星（五芒星）", type: "line", svg: '<polygon points="50,5 61,35 95,35 68,54 78,85 50,65 22,85 32,54 5,35 39,35" fill="#f1c40f"/>' },
            { id: 12, name: "アルファベット Z", type: "point", svg: '<path d="M 20,20 L 80,20 L 20,80 L 80,80" stroke="#e74c3c" stroke-width="15" stroke-linejoin="round" fill="none"/>' },
            { id: 13, name: "上向き矢印", type: "line", svg: '<polygon points="50,10 90,50 70,50 70,90 30,90 30,50 10,50" fill="#1abc9c"/>' },
            { id: 14, name: "直角三角形", type: "none", svg: '<polygon points="20,10 20,90 80,90" fill="#95a5a6"/>' },
            { id: 15, name: "アルファベット L", type: "none", svg: '<path d="M 30,10 L 30,80 L 80,80" stroke="#34495e" stroke-width="15" fill="none"/>' },
            { id: 16, name: "正六角形", type: "both", svg: '<polygon points="50,5 89,27 89,72 50,95 11,72 11,27" fill="#8e44ad"/>' },
            { id: 17, name: "正五角形", type: "line", svg: '<polygon points="50,10 88,38 73,86 27,86 12,38" fill="#e84393"/>' },
            { id: 18, name: "ハート", type: "line", svg: '<path d="M50,85 C50,85 10,55 10,30 A20,20 0 0,1 50,30 A20,20 0 0,1 90,30 C90,55 50,85 50,85 Z" fill="#ff4757"/>' },
            { id: 19, name: "十字（プラス）", type: "both", svg: '<path d="M40,10 L60,10 L60,40 L90,40 L90,60 L60,60 L60,90 L40,90 L40,60 L10,60 L10,40 L40,40 Z" fill="#2ed573"/>' },
            { id: 20, name: "アルファベット H", type: "both", svg: '<path d="M25,15 L40,15 L40,40 L60,40 L60,15 L75,15 L75,85 L60,85 L60,55 L40,55 L40,85 L25,85 Z" fill="#1e90ff"/>' },
            { id: 21, name: "アルファベット A", type: "line", svg: '<path d="M40,15 L60,15 L85,85 L65,85 L58,65 L42,65 L35,85 L15,85 Z M46,45 L54,45 L50,30 Z" fill="#ffa502"/>' },
            { id: 22, name: "アルファベット M", type: "line", svg: '<path d="M15,90 L15,20 L40,20 L50,50 L60,20 L85,20 L85,90 L65,90 L65,50 L50,70 L35,50 L35,90 Z" fill="#3742fa"/>' },
            { id: 23, name: "アルファベット F", type: "none", svg: '<path d="M25,15 L75,15 L75,30 L45,30 L45,45 L65,45 L65,60 L45,60 L45,85 L25,85 Z" fill="#2f3542"/>' },
            { id: 24, name: "アルファベット X", type: "both", svg: '<path d="M20,20 L35,20 L50,40 L65,20 L80,20 L55,50 L80,80 L65,80 L50,60 L35,80 L20,80 L45,50 Z" fill="#c56cf0"/>' },
            { id: 25, name: "稲妻（イナズマ）", type: "point", svg: '<polygon points="60,10 20,60 50,60 40,90 80,40 50,40" fill="#eccc68"/>' },
            { id: 26, name: "六芒星", type: "both", svg: '<path d="M50,10 L85,70 L15,70 Z M50,90 L15,30 L85,30 Z" fill="#ff7f50"/>' },
            { id: 27, name: "三日月", type: "line", svg: '<path d="M60,10 A40,40 0 1,0 60,90 A30,30 0 1,1 60,10 Z" fill="#e1b12c"/>' },
            { id: 28, name: "しずく", type: "line", svg: '<path d="M50,15 Q80,50 80,70 A30,30 0 1,1 20,70 Q20,50 50,15 Z" fill="#70a1ff"/>' },
            { id: 29, name: "両方向矢印", type: "both", svg: '<polygon points="30,40 30,20 10,50 30,80 30,60 70,60 70,80 90,50 70,20 70,40" fill="#ff6348"/>' },
            { id: 30, name: "吹き出し", type: "none", svg: '<path d="M15,30 Q15,15 50,15 Q85,15 85,30 Q85,60 50,60 Q30,60 15,80 Q20,60 15,60 Q15,60 15,30 Z" fill="#a4b0be"/>' }
        ];

        let currentShapeIndex = 0;
        let currentShapeData = null;
        let activeElement = null;
        let audioCtx;

        // 効果音生成（ファイル不要にするためWeb Audio APIを使用）
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                // ピロン！
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
                osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1); // A6
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else {
                // ブブー
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        function startGame() {
            initAudio();
            document.getElementById('start-overlay').style.display = 'none';
            // 配列をシャッフル
            shapesData.sort(() => Math.random() - 0.5);
            spawnShape();
        }

        function spawnShape() {
            if (currentShapeIndex >= shapesData.length) {
                alert("ぜんぶ終わりました！おつかれさま！");
                currentShapeIndex = 0;
                shapesData.sort(() => Math.random() - 0.5); // 再シャッフル
            }

            currentShapeData = shapesData[currentShapeIndex];
            const lane = document.getElementById('lane-container');
            
            // 図形要素の作成
            const el = document.createElement('div');
            el.className = 'shape-item';
            el.innerHTML = `<svg viewBox="0 0 100 100" width="100%" height="100%">${currentShapeData.svg}</svg>`;
            
            // 右端からスタート
            el.style.left = '100%';
            lane.appendChild(el);
            activeElement = el;

            // アニメーションで中央へ
            setTimeout(() => {
                el.style.left = 'calc(50% - 60px)'; // target-zoneの真ん中
            }, 50);
        }

        function checkAnswer(selectedType) {
            if (!activeElement) return;
            
            const isCorrect = (selectedType === currentShapeData.type);
            playSound(isCorrect ? 'correct' : 'wrong');
            
            showLabModal(isCorrect);
        }

        function showLabModal(isCorrect) {
            const modal = document.getElementById('modal');
            const resultText = document.getElementById('modal-result');
            const expText = document.getElementById('modal-exp');
            const labShape = document.getElementById('lab-shape');
            const axis = document.getElementById('axis');

            // モーダル設定
            modal.style.display = 'flex';
            resultText.innerText = isCorrect ? "大正解！🎉" : "ざんねん！💦";
            resultText.style.color = isCorrect ? "#ffeaa7" : "#ff7675";
            
            // 図形をセット
            labShape.innerHTML = `<svg viewBox="0 0 100 100" width="100%" height="100%">${currentShapeData.svg}</svg>`;
            labShape.className = ""; // クラスリセット
            axis.style.display = 'none'; // 軸リセット

            // 解説とアニメーションのセット
            let exp = `これは「${currentShapeData.name}」です。<br>`;
            
            if (currentShapeData.type === 'line' || currentShapeData.type === 'both') {
                axis.style.display = 'block';
                exp += "赤い線で折ると、ぴったり重なるね！（線対称）<br>";
            }
            if (currentShapeData.type === 'point' || currentShapeData.type === 'both') {
                labShape.classList.add('anim-point');
                exp += "180度まわしても、元の形と同じだね！（点対称）";
            }
            if (currentShapeData.type === 'none') {
                exp += "折っても重ならないし、回しても元の形にならないね。";
            }

            expText.innerHTML = exp;
        }

        function nextShape() {
            document.getElementById('modal').style.display = 'none';
            if (activeElement) {
                activeElement.remove();
                activeElement = null;
            }
            currentShapeIndex++;
            spawnShape();
        }
    </script>
</body>
</html>
