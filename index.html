<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>しわけくんEX</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f0f4ff;
            --primary: #ff9f43;
            --btn-line: #ff6b6b;
            --btn-point: #54a0ff;
            --btn-both: #a29bfe;
            --btn-none: #a4b0be;
            --success: #1dd1a1;
            --fail: #ff6b6b;
            --text: #2d3436;
            --card: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ========== HEADER ========== */
        header {
            background: var(--primary);
            color: white;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
            z-index: 50;
            flex-shrink: 0;
        }

        .stat-pill {
            background: rgba(0,0,0,0.18);
            padding: 5px 14px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 700;
        }

        .stat-pill.time { background: rgba(231,76,60,0.7); }

        #header-title { font-size: 1.1rem; font-weight: 900; }

        /* ========== GAME AREA ========== */
        main {
            flex: 1;
            position: relative;
            background: #dfe6e9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: linear-gradient(90deg, transparent 50%, rgba(255,255,255,0.15) 50%);
            background-size: 40px 40px;
        }

        #target-zone {
            width: 155px;
            height: 155px;
            border: 5px dashed var(--primary);
            border-radius: 24px;
            background: rgba(255,159,67,0.1);
            position: absolute;
            box-shadow: 0 0 20px rgba(255,159,67,0.25);
            pointer-events: none;
        }

        .shape-item {
            position: absolute;
            width: 120px;
            height: 120px;
            z-index: 5;
            transition: left 0.35s cubic-bezier(0.25, 1.5, 0.5, 1);
        }

        /* ========== CONTROLS ========== */
        #controls {
            background: var(--card);
            padding: 14px 16px 16px;
            border-radius: 28px 28px 0 0;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.07);
            flex-shrink: 0;
            display: grid;
            gap: 10px;
        }

        #controls.type-mode { grid-template-columns: 1fr 1fr; }
        #controls.axis-mode { grid-template-columns: repeat(4, 1fr); }

        .ans-btn {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            border: none;
            border-radius: 18px;
            padding: 18px 5px;
            cursor: pointer;
            box-shadow: 0 6px 0 rgba(0,0,0,0.15);
            transition: transform 0.08s, box-shadow 0.08s;
            line-height: 1.2;
        }

        .ans-btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.15);
        }

        .ans-btn.axis-btn { padding: 14px 3px; font-size: 1rem; }

        /* ========== OVERLAYS ========== */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }

        #start-screen {
            background: linear-gradient(145deg, #667eea 0%, #f64f59 100%);
        }

        #end-screen {
            background: linear-gradient(145deg, #11998e 0%, #38ef7d 100%);
            display: none;
        }

        .big-card {
            background: white;
            color: var(--text);
            border-radius: 32px;
            padding: 28px 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .logo {
            font-size: 3rem;
            font-weight: 900;
            line-height: 1.1;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.15);
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 24px;
            background: rgba(255,255,255,0.25);
            padding: 8px 18px;
            border-radius: 20px;
            display: inline-block;
        }

        .mode-btn {
            width: 100%;
            padding: 18px 16px;
            margin-bottom: 12px;
            border: 3px solid #eee;
            border-radius: 22px;
            background: white;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.18s;
            color: var(--text);
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mode-btn:hover, .mode-btn:active { border-color: #667eea; background: #f5f3ff; }

        .mode-icon { font-size: 2rem; flex-shrink: 0; }
        .mode-text small { display: block; font-size: 0.8rem; color: #888; font-weight: 400; margin-top: 2px; }

        .action-btn {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            padding: 16px 50px;
            font-size: 1.5rem;
            font-weight: 700;
            border-radius: 50px;
            border: none;
            background: var(--primary);
            color: white;
            box-shadow: 0 8px 0 #e08e36;
            cursor: pointer;
            animation: bounce 2s infinite;
            margin-top: 10px;
        }

        .action-btn:active { transform: translateY(8px); box-shadow: none; animation: none; }

        @keyframes bounce {
            0%,20%,50%,80%,100% { transform: translateY(0); }
            40% { transform: translateY(-14px); }
            60% { transform: translateY(-7px); }
        }

        /* ========== MODAL ========== */
        #modal {
            position: fixed;
            inset: 0;
            background: rgba(30,30,50,0.92);
            z-index: 200;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }

        #modal-result { font-size: 2.6rem; font-weight: 900; margin-bottom: 4px; }
        #modal-combo  { font-size: 1.3rem; color: #f1c40f; height: 28px; margin-bottom: 16px; }

        #lab-view {
            width: 220px;
            height: 220px;
            background: white;
            border-radius: 28px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        #lab-shape {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            padding: 25px;
        }

        #axis-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        #modal-desc {
            font-size: 1rem;
            line-height: 1.7;
            text-align: center;
            padding: 0 10px;
            margin-bottom: 20px;
            max-width: 340px;
        }

        .next-btn {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            padding: 15px 50px;
            font-size: 1.4rem;
            font-weight: 700;
            border-radius: 50px;
            border: none;
            background: var(--success);
            color: white;
            box-shadow: 0 7px 0 #10ac84;
            cursor: pointer;
        }

        .next-btn:active { transform: translateY(7px); box-shadow: none; }

        /* アニメーション */
        .rotate-anim {
            animation: rotateShape 2.5s ease-in-out infinite alternate;
        }
        @keyframes rotateShape {
            from { transform: rotate(0deg); }
            to   { transform: rotate(180deg); }
        }

        /* スコア跳ね */
        @keyframes scorePop {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.4); color: #f1c40f; }
            100% { transform: scale(1); }
        }
        .score-pop { animation: scorePop 0.35s ease; }

        /* 最終スコア */
        #final-score-num {
            font-size: 5rem;
            font-weight: 900;
            color: var(--primary);
            line-height: 1;
            margin: 10px 0;
        }
        #final-rank {
            font-size: 1.2rem;
            background: #ff6b6b;
            color: white;
            padding: 8px 24px;
            border-radius: 30px;
            margin-bottom: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>

<!-- ========== スタート画面 ========== -->
<div id="start-screen" class="overlay">
    <div class="logo">しわけくんEX</div>
    <div class="tagline">図形の性質をマスターしよう！</div>
    <div class="big-card">
        <h2 style="margin-bottom: 16px; font-size: 1.2rem;">モードをえらぼう</h2>

        <button class="mode-btn" onclick="initGame('type')">
            <span class="mode-icon">📐</span>
            <span class="mode-text">
                線対称・点対称<br>
                <small>せいしつをみわけよう（コンボあり）</small>
            </span>
        </button>

        <button class="mode-btn" onclick="initGame('axis')">
            <span class="mode-icon">📏</span>
            <span class="mode-text">
                対称軸のかず<br>
                <small>何本ひけるかな？</small>
            </span>
        </button>
    </div>
</div>

<!-- ========== 終了画面 ========== -->
<div id="end-screen" class="overlay">
    <div style="font-size: 2rem; font-weight: 900; margin-bottom: 8px;">タイムアップ！⏰</div>
    <div class="big-card">
        <div style="font-size: 1rem; color: #888;">さいしゅうスコア</div>
        <div id="final-score-num">0</div>
        <div id="final-rank">ランク計算中…</div>
        <button class="action-btn" onclick="location.reload()" style="animation:none; display:block; width:100%; padding:16px; font-size:1.3rem;">
            タイトルへ
        </button>
    </div>
</div>

<!-- ========== ヘッダー ========== -->
<header>
    <div class="stat-pill">スコア: <span id="score-val">0</span></div>
    <div id="header-title">しわけくんEX</div>
    <div class="stat-pill time">残り: <span id="time-val">60</span>秒</div>
</header>

<!-- ========== ゲームエリア ========== -->
<main>
    <div id="target-zone"></div>
    <div id="shape-layer"></div>
</main>

<!-- ========== コントロール ========== -->
<div id="controls" class="type-mode"></div>

<!-- ========== 解説モーダル ========== -->
<div id="modal">
    <div id="modal-result">正解！✨</div>
    <div id="modal-combo"></div>
    <div id="lab-view">
        <div id="lab-shape"></div>
        <svg id="axis-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div id="modal-desc"></div>
    <button class="next-btn" onclick="closeModal()">次へすすむ</button>
</div>

<script>
// ============================================================
// 図形データ（29種 + 軸情報付き）
// ============================================================
const SHAPES = [
    // name, type (line/point/both/none), axis (本数), angles (対称軸の角度°), svg
    { name:"二等辺三角形",  type:"line",  axis:1, angles:[90],  axisMode:true,
      svg:'<polygon points="50,10 90,90 10,90" fill="#ff6b6b"/>' },
    { name:"平行四辺形",    type:"point", axis:0, angles:[],
      svg:'<polygon points="30,20 90,20 70,80 10,80" fill="#4ecdc4"/>' },
    { name:"正方形",        type:"both",  axis:4, angles:[0,45,90,135], axisMode:true,
      svg:'<rect x="20" y="20" width="60" height="60" fill="#45b7d1"/>' },
    { name:"長方形",        type:"both",  axis:2, angles:[0,90], axisMode:true,
      svg:'<rect x="10" y="30" width="80" height="40" fill="#96ceb4"/>' },
    { name:"ひし形",        type:"both",  axis:2, angles:[0,90], axisMode:true,
      svg:'<polygon points="50,10 90,50 50,90 10,50" fill="#ffeead"/>' },
    { name:"等脚台形",      type:"line",  axis:1, angles:[90], axisMode:true,
      svg:'<polygon points="30,20 70,20 90,80 10,80" fill="#d4a5a5"/>' },
    { name:"円",            type:"both",  axis:8, angles:[0,45,90,135], axisMode:true,
      svg:'<circle cx="50" cy="50" r="40" fill="#9b59b6"/>' },
    { name:"半円",          type:"line",  axis:1, angles:[90],
      svg:'<path d="M 10,50 A 40,40 0 0,1 90,50 Z" fill="#3498db"/>' },
    { name:"アルファベット N", type:"point", axis:0, angles:[],
      svg:'<path d="M 25,80 L 25,20 L 75,80 L 75,20" stroke="#e67e22" stroke-width="15" fill="none"/>' },
    { name:"アルファベット S", type:"point", axis:0, angles:[],
      svg:'<path d="M 80,30 Q 80,10 50,10 Q 20,10 20,30 Q 20,50 50,50 Q 80,50 80,70 Q 80,90 50,90 Q 20,90 20,70" stroke="#2ecc71" stroke-width="12" fill="none"/>' },
    { name:"星（五芒星）",  type:"line",  axis:5, angles:[90,162,234,306,18],
      svg:'<polygon points="50,5 61,35 95,35 68,54 78,85 50,65 22,85 32,54 5,35 39,35" fill="#f1c40f"/>' },
    { name:"アルファベット Z", type:"point", axis:0, angles:[],
      svg:'<path d="M 20,20 L 80,20 L 20,80 L 80,80" stroke="#e74c3c" stroke-width="15" stroke-linejoin="round" fill="none"/>' },
    { name:"上向き矢印",    type:"line",  axis:1, angles:[90],
      svg:'<polygon points="50,10 90,50 70,50 70,90 30,90 30,50 10,50" fill="#1abc9c"/>' },
    { name:"直角三角形",    type:"none",  axis:0, angles:[],
      svg:'<polygon points="20,10 20,90 80,90" fill="#95a5a6"/>' },
    { name:"アルファベット L", type:"none", axis:0, angles:[],
      svg:'<path d="M 30,10 L 30,80 L 80,80" stroke="#34495e" stroke-width="15" fill="none"/>' },
    { name:"正六角形",      type:"both",  axis:6, angles:[0,30,60,90,120,150], axisMode:true,
      svg:'<polygon points="50,5 89,27 89,72 50,95 11,72 11,27" fill="#8e44ad"/>' },
    { name:"正五角形",      type:"line",  axis:5, angles:[90,162,234,306,18], axisMode:true,
      svg:'<polygon points="50,10 88,38 73,86 27,86 12,38" fill="#e84393"/>' },
    { name:"ハート",        type:"line",  axis:1, angles:[90],
      svg:'<path d="M50,85 C50,85 10,55 10,30 A20,20 0 0,1 50,30 A20,20 0 0,1 90,30 C90,55 50,85 50,85 Z" fill="#ff4757"/>' },
    { name:"十字",          type:"both",  axis:4, angles:[0,45,90,135],
      svg:'<path d="M40,10 L60,10 L60,40 L90,40 L90,60 L60,60 L60,90 L40,90 L40,60 L10,60 L10,40 L40,40 Z" fill="#2ed573"/>' },
    { name:"アルファベット H", type:"both", axis:2, angles:[0,90],
      svg:'<path d="M25,15 L40,15 L40,40 L60,40 L60,15 L75,15 L75,85 L60,85 L60,55 L40,55 L40,85 L25,85 Z" fill="#1e90ff"/>' },
    { name:"アルファベット A", type:"line", axis:1, angles:[90],
      svg:'<path d="M40,15 L60,15 L85,85 L65,85 L58,65 L42,65 L35,85 L15,85 Z M46,45 L54,45 L50,30 Z" fill="#ffa502"/>' },
    { name:"アルファベット M", type:"line", axis:1, angles:[90],
      svg:'<path d="M15,90 L15,20 L40,20 L50,50 L60,20 L85,20 L85,90 L65,90 L65,50 L50,70 L35,50 L35,90 Z" fill="#3742fa"/>' },
    { name:"アルファベット F", type:"none", axis:0, angles:[],
      svg:'<path d="M25,15 L75,15 L75,30 L45,30 L45,45 L65,45 L65,60 L45,60 L45,85 L25,85 Z" fill="#2f3542"/>' },
    { name:"アルファベット X", type:"both", axis:4, angles:[0,45,90,135],
      svg:'<path d="M20,20 L35,20 L50,40 L65,20 L80,20 L55,50 L80,80 L65,80 L50,60 L35,80 L20,80 L45,50 Z" fill="#c56cf0"/>' },
    { name:"稲妻（イナズマ）", type:"point", axis:0, angles:[],
      svg:'<polygon points="60,10 20,60 50,60 40,90 80,40 50,40" fill="#eccc68"/>' },
    { name:"六芒星",        type:"both",  axis:6, angles:[0,30,60,90,120,150],
      svg:'<path d="M50,10 L85,70 L15,70 Z M50,90 L15,30 L85,30 Z" fill="#ff7f50"/>' },
    { name:"しずく",        type:"line",  axis:1, angles:[90],
      svg:'<path d="M50,15 Q80,50 80,70 A30,30 0 1,1 20,70 Q20,50 50,15 Z" fill="#70a1ff"/>' },
    { name:"両方向矢印",    type:"both",  axis:2, angles:[0,90],
      svg:'<polygon points="30,40 30,20 10,50 30,80 30,60 70,60 70,80 90,50 70,20 70,40" fill="#ff6348"/>' },
    { name:"正三角形",      type:"line",  axis:3, angles:[90,210,330], axisMode:true,
      svg:'<polygon points="50,10 90,85 10,85" fill="#ff9f43"/>' },
];

// ============================================================
// 状態
// ============================================================
let gameMode = 'type';
let score = 0;
let combo = 0;
let timeLeft = 60;
let timerInterval = null;
let currentShape = null;
let activeEl = null;
let shapeQueue = [];
let audioCtx = null;

// ============================================================
// Audio
// ============================================================
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSfx(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
        osc.start(); osc.stop(audioCtx.currentTime + 0.35);
    } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
    }
}

// ============================================================
// ゲーム初期化
// ============================================================
function initGame(mode) {
    initAudio();
    gameMode = mode;
    score = 0;
    combo = 0;
    timeLeft = 60;

    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('score-val').innerText = '0';
    document.getElementById('time-val').innerText = '60';
    document.getElementById('header-title').innerText =
        mode === 'type' ? '仕分けモード' : '対称軸モード';

    buildControls();
    refillQueue();
    spawn();
    startTimer();
}

function buildControls() {
    const ctrl = document.getElementById('controls');
    if (gameMode === 'type') {
        ctrl.className = 'type-mode';
        const btns = [
            { k:'line',  label:'線対称',  color:'#ff6b6b' },
            { k:'point', label:'点対称',  color:'#54a0ff' },
            { k:'both',  label:'どっちも',color:'#a29bfe' },
            { k:'none',  label:'ちがう',  color:'#a4b0be' },
        ];
        ctrl.innerHTML = btns.map(b =>
            `<button class="ans-btn" style="background:${b.color}" onclick="check('${b.k}')">${b.label}</button>`
        ).join('');
    } else {
        ctrl.className = 'axis-mode';
        const vals = [0,1,2,3,4,5,6,8];
        const colors = ['#636e72','#fdcb6e','#e17055','#6c5ce7','#0984e3','#e84393','#00b894','#fd79a8'];
        ctrl.innerHTML = vals.map((v,i) =>
            `<button class="ans-btn axis-btn" style="background:${colors[i]}" onclick="check(${v})">${v===8?'たくさん':v+'本'}</button>`
        ).join('');
    }
}

function refillQueue() {
    const pool = gameMode === 'axis'
        ? SHAPES.filter(s => s.axisMode)
        : SHAPES;
    shapeQueue = [...pool].sort(() => Math.random() - 0.5);
}

// ============================================================
// タイマー
// ============================================================
function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('time-val').innerText = timeLeft;
        if (timeLeft <= 0) endGame();
    }, 1000);
}

function endGame() {
    clearInterval(timerInterval);
    document.getElementById('modal').style.display = 'none';
    if (activeEl) { activeEl.remove(); activeEl = null; }

    let rank = '🐣 まだまだこれから！';
    if (score >= 5000) rank = '👑 伝説の対称マスター！';
    else if (score >= 3000) rank = '🌟 スゴウデしわけ職人';
    else if (score >= 1500) rank = '👍 なかなかのセンス！';

    document.getElementById('final-score-num').innerText = score;
    document.getElementById('final-rank').innerText = rank;
    document.getElementById('end-screen').style.display = 'flex';
}

// ============================================================
// 図形スポーン
// ============================================================
function spawn() {
    if (timeLeft <= 0) return;
    if (shapeQueue.length === 0) refillQueue();

    currentShape = shapeQueue.pop();
    const layer = document.getElementById('shape-layer');
    const el = document.createElement('div');
    el.className = 'shape-item';
    el.innerHTML = `<svg viewBox="0 0 100 100" width="100%" height="100%">${currentShape.svg}</svg>`;
    el.style.left = '110%';
    layer.appendChild(el);
    activeEl = el;
    setTimeout(() => { if (activeEl) el.style.left = 'calc(50% - 60px)'; }, 40);
}

// ============================================================
// 正誤判定
// ============================================================
function check(ans) {
    if (!activeEl || timeLeft <= 0) return;
    clearInterval(timerInterval); // モーダル表示中は停止

    let correct;
    if (gameMode === 'type') {
        correct = (ans === currentShape.type);
    } else {
        // 軸モード：円は「8」ボタン＝無数扱い
        correct = (ans === currentShape.axis);
    }

    playSfx(correct ? 'correct' : 'wrong');

    if (correct) {
        combo++;
        const pts = gameMode === 'type' ? 100 + combo * 20 : 100;
        score += pts;
        // スコア表示アニメ
        const sv = document.getElementById('score-val');
        sv.innerText = score;
        sv.classList.remove('score-pop');
        void sv.offsetWidth;
        sv.classList.add('score-pop');
    } else {
        combo = 0;
        document.getElementById('score-val').innerText = score;
    }

    showModal(correct);
}

// ============================================================
// モーダル表示
// ============================================================
function showModal(isCorrect) {
    const modal   = document.getElementById('modal');
    const result  = document.getElementById('modal-result');
    const comboEl = document.getElementById('modal-combo');
    const labShape= document.getElementById('lab-shape');
    const axisSvg = document.getElementById('axis-svg');
    const desc    = document.getElementById('modal-desc');

    modal.style.display = 'flex';

    result.innerText = isCorrect ? '大正解！✨' : 'ざんねん！💦';
    result.style.color = isCorrect ? '#1dd1a1' : '#ff6b6b';

    if (gameMode === 'type') {
        comboEl.innerText = (isCorrect && combo >= 2) ? `${combo}コンボ！🔥` : '';
    } else {
        comboEl.innerText = '';
    }

    // 図形表示
    labShape.innerHTML = `<svg viewBox="0 0 100 100" width="100%" height="100%">${currentShape.svg}</svg>`;
    labShape.classList.remove('rotate-anim');

    // 点対称アニメ
    if (currentShape.type === 'point' || currentShape.type === 'both') {
        labShape.classList.add('rotate-anim');
    }

    // 対称軸の描画（viewBox=100x100、中心50,50）
    axisSvg.innerHTML = '';
    const NS = 'http://www.w3.org/2000/svg';
    const CX = 50, CY = 50, R = 52;

    if (currentShape.axis > 0) {
        currentShape.angles.forEach(deg => {
            const r  = deg * Math.PI / 180;
            const x1 = CX + R * Math.cos(r);
            const y1 = CY - R * Math.sin(r);
            const x2 = CX - R * Math.cos(r);
            const y2 = CY + R * Math.sin(r);
            const line = document.createElementNS(NS, 'line');
            line.setAttribute('x1', x1.toFixed(1));
            line.setAttribute('y1', y1.toFixed(1));
            line.setAttribute('x2', x2.toFixed(1));
            line.setAttribute('y2', y2.toFixed(1));
            line.setAttribute('stroke', '#ff4757');
            line.setAttribute('stroke-width', '1.5');
            line.setAttribute('stroke-dasharray', '4 3');
            line.setAttribute('opacity', '0.9');
            axisSvg.appendChild(line);
        });
    }

    // 対称の中心（点対称・どっちも・軸モードで常に表示）
    const showCenter = currentShape.type === 'point' || currentShape.type === 'both'
        || gameMode === 'axis';
    if (showCenter) {
        const outer = document.createElementNS(NS, 'circle');
        outer.setAttribute('cx', CX); outer.setAttribute('cy', CY);
        outer.setAttribute('r', '4.5');
        outer.setAttribute('fill', '#2d3436');
        axisSvg.appendChild(outer);
        const inner = document.createElementNS(NS, 'circle');
        inner.setAttribute('cx', CX); inner.setAttribute('cy', CY);
        inner.setAttribute('r', '2.5');
        inner.setAttribute('fill', '#ffffff');
        axisSvg.appendChild(inner);
    }

    // 解説文
    let text = `<b>「${currentShape.name}」</b><br><br>`;
    if (gameMode === 'type') {
        const map = { line:'線対称のみ', point:'点対称のみ', both:'どっちも（線対称・点対称）', none:'どちらでもない' };
        text += `この図形は <b>${map[currentShape.type]}</b> です。`;
        if (currentShape.type === 'line' || currentShape.type === 'both') {
            const n = currentShape.axis === 8 ? '無数に' : currentShape.axis + '本';
            text += `<br>対称軸は <b>${n}</b> あります。`;
        }
    } else {
        const axisText = currentShape.axis === 8 ? '無数（何本でも引ける）' : currentShape.axis + '本';
        text += `対称軸は <b>${axisText}</b> です。`;
        if (currentShape.axis === 0) {
            text += '<br>（この図形は線対称ではありません）';
        }
    }

    desc.innerHTML = text;
}

// ============================================================
// モーダルを閉じて次へ
// ============================================================
function closeModal() {
    document.getElementById('modal').style.display = 'none';
    // 古いelを別変数に退避してからnullにする（spawnで上書きされる前に）
    const oldEl = activeEl;
    activeEl = null;
    if (oldEl) {
        oldEl.style.left = '-25%';
        setTimeout(() => oldEl.remove(), 400);
    }
    if (timeLeft > 0) {
        startTimer();
        spawn();
    }
}
</script>
</body>
</html>
